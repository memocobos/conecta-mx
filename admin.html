<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conecta Reynosa — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --negro: #000000; --blanco: #ffffff; --azul: #0000cd;
    --rojo: #ff283b; --amarillo: #e8ff4c; --verde: #88ea4e;
    --gris: #111111; --gris2: #1a1a1a; --gris3: #2a2a2a; --texto-sec: #888888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--negro); color: var(--blanco); font-family: 'Montserrat', sans-serif; min-height: 100vh; }

  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box { width: 360px; padding: 40px; border: 1px solid var(--gris3); background: var(--gris); }
  .login-box h1 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 2px; color: var(--amarillo); margin-bottom: 4px; }
  .login-box p { font-size: 12px; color: var(--texto-sec); margin-bottom: 32px; text-transform: uppercase; letter-spacing: 1px; }
  .login-box input { width: 100%; background: var(--gris2); border: 1px solid var(--gris3); color: var(--blanco); padding: 12px 16px; font-size: 14px; font-family: 'Montserrat', sans-serif; margin-bottom: 12px; outline: none; }
  .login-box input:focus { border-color: var(--azul); }
  .login-box button { width: 100%; background: var(--azul); color: var(--blanco); border: none; padding: 14px; font-size: 14px; font-weight: 700; font-family: 'Montserrat', sans-serif; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
  .login-box button:hover { background: #0000a0; }
  .login-error { color: var(--rojo); font-size: 12px; margin-top: 8px; display: none; }

  #app { display: none; }
  .header { background: var(--gris); border-bottom: 1px solid var(--gris3); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 100; }
  .header-logo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 3px; color: var(--amarillo); }
  .header-nav { display: flex; gap: 4px; }
  .nav-btn { padding: 6px 14px; font-size: 12px; font-weight: 600; font-family: 'Montserrat', sans-serif; border: none; background: transparent; color: var(--texto-sec); cursor: pointer; text-transform: uppercase; letter-spacing: 1px; border-radius: 2px; transition: all .15s; }
  .nav-btn.active { background: var(--gris3); color: var(--blanco); }
  .nav-btn:hover:not(.active) { color: var(--blanco); }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .role-badge { font-size: 11px; font-weight: 600; padding: 4px 10px; background: var(--gris3); color: var(--texto-sec); text-transform: uppercase; letter-spacing: 1px; }
  .logout-btn { font-size: 11px; color: var(--texto-sec); background: none; border: none; cursor: pointer; font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 1px; }
  .logout-btn:hover { color: var(--rojo); }

  .view { display: none; padding: 24px; }
  .view.active { display: block; }

  .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .metric-card { background: var(--gris); border: 1px solid var(--gris3); padding: 20px; }
  .metric-label { font-size: 11px; font-weight: 600; color: var(--texto-sec); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .metric-val { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 1px; }
  .metric-sub { font-size: 11px; color: var(--texto-sec); margin-top: 4px; }
  .metric-card.verde .metric-val { color: var(--verde); }
  .metric-card.rojo .metric-val { color: var(--rojo); }
  .metric-card.amarillo .metric-val { color: var(--amarillo); }
  .metric-card.azul .metric-val { color: #4488ff; }

  .card { background: var(--gris); border: 1px solid var(--gris3); padding: 20px; margin-bottom: 16px; }
  .card-title { font-size: 11px; font-weight: 700; color: var(--texto-sec); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .ev-list { display: flex; flex-direction: column; }
  .ev-row { display: grid; grid-template-columns: 1fr 80px 120px 100px 110px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--gris3); gap: 12px; }
  .ev-row:last-child { border-bottom: none; }
  .bar-wrap { height: 4px; background: var(--gris3); border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--verde); border-radius: 2px; }
  .bar-fill.warn { background: var(--amarillo); }
  .bar-fill.danger { background: var(--rojo); }

  .badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 3px 8px; text-transform: uppercase; letter-spacing: 1px; }
  .badge-verde { background: rgba(136,234,78,.15); color: var(--verde); }
  .badge-rojo { background: rgba(255,40,59,.15); color: var(--rojo); }
  .badge-amarillo { background: rgba(232,255,76,.15); color: var(--amarillo); }
  .badge-azul { background: rgba(0,0,205,.2); color: #4488ff; }
  .badge-gris { background: var(--gris3); color: var(--texto-sec); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { font-size: 10px; font-weight: 700; color: var(--texto-sec); text-transform: uppercase; letter-spacing: 1px; padding: 0 8px 10px 0; border-bottom: 1px solid var(--gris3); text-align: left; }
  td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--gris3); color: var(--blanco); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }

  select { background: var(--gris2); border: 1px solid var(--gris3); color: var(--blanco); padding: 8px 12px; font-size: 13px; font-family: 'Montserrat', sans-serif; outline: none; margin-bottom: 16px; width: 100%; }
  select:focus { border-color: var(--azul); }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--texto-sec); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .form-group input, .form-group select { width: 100%; background: var(--gris2); border: 1px solid var(--gris3); color: var(--blanco); padding: 10px 12px; font-size: 13px; font-family: 'Montserrat', sans-serif; outline: none; margin-bottom: 0; }
  .form-group input:focus, .form-group select:focus { border-color: var(--azul); }
  .btn-primary { background: var(--azul); color: var(--blanco); border: none; padding: 12px 24px; font-size: 12px; font-weight: 700; font-family: 'Montserrat', sans-serif; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; width: 100%; }
  .btn-primary:hover { background: #0000a0; }

  .loading { text-align: center; padding: 40px; color: var(--texto-sec); font-size: 13px; }
  .spinner { width: 24px; height: 24px; border: 2px solid var(--gris3); border-top-color: var(--azul); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .alerta-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--gris3); font-size: 13px; }
  .alerta-row:last-child { border-bottom: none; }
  .alerta-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  @media (max-width: 768px) {
    .metrics-grid { grid-template-columns: 1fr 1fr; }
    .two-col { grid-template-columns: 1fr; }
    .ev-row { grid-template-columns: 1fr 70px 80px; }
    .ev-row > :nth-child(4), .ev-row > :nth-child(5) { display: none; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>Conecta</h1>
    <p>Reynosa — Panel de administración</p>
    <input type="text" id="login-user" placeholder="Usuario" autocomplete="off">
    <input type="password" id="login-pass" placeholder="Contraseña">
    <button onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-error">Usuario o contraseña incorrectos</div>
  </div>
</div>

<div id="app">
  <div class="header">
    <div class="header-logo">Conecta Reynosa</div>
    <div class="header-nav" id="header-nav"></div>
    <div class="header-right">
      <div class="role-badge" id="role-label">Admin</div>
      <button class="logout-btn" onclick="doLogout()">Salir</button>
    </div>
  </div>

  <div id="view-resumen" class="view"></div>
  <div id="view-eventos" class="view">
    <div class="card">
      <div class="card-title">Seleccionar evento</div>
      <select id="evento-select" onchange="loadEvento(this.value)"><option value="">— Selecciona un evento —</option></select>
    </div>
    <div id="evento-content"></div>
  </div>
  <div id="view-pagos" class="view">
    <div class="card">
      <div class="card-title">Registrar pago</div>
      <div class="form-grid">
        <div class="form-group"><label>Cliente</label><input type="text" id="pago-cliente" placeholder="Nombre del cliente"></div>
        <div class="form-group"><label>Evento</label><select id="pago-evento"><option value="">Seleccionar...</option></select></div>
        <div class="form-group"><label>Monto ($)</label><input type="number" id="pago-monto" placeholder="0"></div>
        <div class="form-group"><label>Método</label>
          <select id="pago-metodo"><option>Transferencia</option><option>Clip</option><option>Efectivo</option><option>Otro</option></select>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:16px"><label>Referencia (opcional)</label><input type="text" id="pago-ref" placeholder="Número de referencia"></div>
      <button class="btn-primary" onclick="registrarPago()">Registrar pago</button>
      <div id="pago-msg" style="margin-top:10px;font-size:12px;display:none"></div>
    </div>
    <div class="card">
      <div class="card-title">Últimos pagos registrados</div>
      <div id="pagos-recientes"><div class="loading"><div class="spinner"></div>Cargando...</div></div>
    </div>
  </div>
  
  <div id="view-gastos" class="view">
    <div class="card" style="margin-bottom:16px">
      <div class="card-title">Registrar gasto</div>
      <div class="form-grid">
        <div class="form-group"><label>Concepto *</label><input id="g-concepto" type="text" placeholder="Ej: Pago boletos Morat"></div>
        <div class="form-group"><label>Monto *</label><input id="g-monto" type="number" placeholder="0.00"></div>
        <div class="form-group"><label>Categoría *</label>
          <select id="g-categoria">
            <option value="">Seleccionar...</option>
            <option>Boletos</option><option>Bus</option><option>Hotel</option><option>Kits</option>
            <option>Estacionamiento</option><option>Pauta</option><option>Salarios</option>
            <option>Contadora</option><option>Herramientas</option><option>Redes sociales</option><option>Otro</option>
          </select>
        </div>
        <div class="form-group"><label>Fecha *</label><input id="g-fecha" type="date"></div>
        <div class="form-group"><label>Evento (opcional)</label>
          <select id="g-evento"><option value="">Gasto general / fijo</option></select>
        </div>
        <div class="form-group"><label>Notas</label><input id="g-notas" type="text" placeholder="Descripción adicional"></div>
      </div>
      <button onclick="registrarGasto()" style="margin-top:8px;background:var(--amarillo);color:#000;border:none;padding:10px 24px;border-radius:6px;font-weight:700;cursor:pointer;font-size:14px">Registrar gasto</button>
      <div id="g-msg" style="margin-top:8px;font-size:13px"></div>
    </div>
    <div class="card">
      <div class="card-title">Gastos registrados</div>
      <div id="gastos-lista"><div class="loading"><div class="spinner"></div>Cargando...</div></div>
    </div>
  </div>

  <div id="view-vendedor" class="view"><div id="vendedor-content"></div></div>
</div>

<script>
// La función proxy de Netlify — el token vive en el servidor, no aquí
const API = "/.netlify/functions/airtable-proxy";

const USERS = {
  "memo":     { pass: "conecta2026", role: "admin",    label: "Memo — Admin" },
  "auxiliar": { pass: "admin2026",   role: "auxiliar", label: "Auxiliar Admin" },
  "coordi":   { pass: "coordi2026", role: "coordi",   label: "Coordinador" },
  "ventas":   { pass: "ventas2026",  role: "vendedor", label: "Vendedor" },
};

const ROLES = {
  admin:    { views: ["resumen","eventos","pagos","gastos"] },
  auxiliar: { views: ["pagos","eventos","gastos"] },
  coordi:   { views: ["eventos"] },
  vendedor: { views: ["vendedor"] },
};

const VIEW_LABELS = { resumen:"Resumen", eventos:"Por evento", pagos:"Pagos", gastos:"Gastos", vendedor:"Mis ventas" };

let currentRole = null;
let eventosCache = [];
let reservCache = [];
let clientesCache = {};

function doLogin() {
  const u = document.getElementById('login-user').value.trim().toLowerCase();
  const p = document.getElementById('login-pass').value;
  const user = USERS[u];
  if (!user || user.pass !== p) {
    document.getElementById('login-error').style.display = 'block'; return;
  }
  currentRole = user.role;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('role-label').textContent = user.label;
  buildNav();
  initApp();
}

function doLogout() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
}

document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function buildNav() {
  const nav = document.getElementById('header-nav');
  nav.innerHTML = '';
  ROLES[currentRole].views.forEach((v, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (i===0?' active':'');
    btn.textContent = VIEW_LABELS[v];
    btn.onclick = () => {
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
      document.getElementById('view-'+v).classList.add('active');
      if(v==='eventos' && !document.getElementById('evento-select').options.length > 1) populateEventoSelect();
      if(v==='gastos') { if(eventosCache.length>0) initGastos(); else setTimeout(()=>initGastos(),4000); }
    };
    nav.appendChild(btn);
    if(i===0) document.getElementById('view-'+v).classList.add('active');
  });
}

function showLoading(id) {
  document.getElementById(id).innerHTML = '<div class="loading"><div class="spinner"></div>Cargando datos...</div>';
}

async function atFetch(tabla, params='') {
  let records=[], offset=null;
  do {
    const res = await fetch(API, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ tabla, params: `?pageSize=100${params}${offset?'&offset='+offset:''}`, method:'GET' })
    }).then(r=>r.json());
    records.push(...(res.records||[]));
    offset = res.offset;
  } while(offset);
  return records;
}

async function atPost(tabla, fields) {
  return fetch(API, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ tabla, method:'POST', body: JSON.stringify({records:[{fields}]}) })
  }).then(r=>r.json());
}

function pesos(n){ return '$'+Math.round(n||0).toLocaleString('es-MX'); }
function fecha(f){ return f ? new Date(f+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'short'}) : '—'; }

async function initApp() {
  showLoading('view-resumen');
  const [eventos, reservaciones, clientes] = await Promise.all([
    atFetch('Eventos','&sort%5B0%5D%5Bfield%5D=Fecha&sort%5B0%5D%5Bdirection%5D=asc'),
    atFetch('Reservaciones'),
    atFetch('Clientes')
  ]);
  eventosCache = eventos;
  reservCache = reservaciones;
  if(currentView==="gastos") initGastos();
  clientes.forEach(c => clientesCache[c.id] = c.fields);
  populateEventoSelect();
  if(currentRole==='admin'||currentRole==='auxiliar') loadResumen();
  if(currentRole==='auxiliar') loadPagosRecientes();
  if(currentRole==='vendedor') loadVendedor();
}

function populateEventoSelect() {
  const proximos = eventosCache.filter(e=>e.fields.Status==='Próximo');
  ['evento-select','pago-evento'].forEach(id=>{
    const sel=document.getElementById(id); if(!sel) return;
    sel.innerHTML='<option value="">— Seleccionar —</option>';
    proximos.forEach(e=>{ sel.innerHTML+=`<option value="${e.id}">${e.fields.Nombre}</option>`; });
  });
}

async function loadResumen() {
  const pagos = await atFetch('Pagos');
  const totalCobrado = pagos.reduce((a,p)=>a+(p.fields.Monto||0),0);
  const totalPorCobrar = reservCache.reduce((a,r)=>a+Math.max(0,(r.fields['Total a pagar']||0)-(r.fields['Total abonado']||0)),0);
  const proximos = eventosCache.filter(e=>e.fields.Status==='Próximo');

  let html = `<div class="metrics-grid">
    <div class="metric-card verde"><div class="metric-label">Total cobrado</div><div class="metric-val">${pesos(totalCobrado)}</div><div class="metric-sub">${pagos.length} pagos</div></div>
    <div class="metric-card rojo"><div class="metric-label">Por cobrar</div><div class="metric-val">${pesos(totalPorCobrar)}</div><div class="metric-sub">Saldo pendiente</div></div>
    <div class="metric-card azul"><div class="metric-label">Reservaciones</div><div class="metric-val">${reservCache.length}</div><div class="metric-sub">Clientes activos</div></div>
    <div class="metric-card amarillo"><div class="metric-label">Próximos</div><div class="metric-val">${proximos.length}</div><div class="metric-sub">Eventos en agenda</div></div>
  </div>
  <div class="card"><div class="card-title">Próximos eventos — cobranza</div><div class="ev-list">
    <div class="ev-row" style="font-size:10px;color:var(--texto-sec);font-weight:700;text-transform:uppercase;letter-spacing:1px;padding-bottom:6px">
      <span>Evento</span><span>Fecha</span><span>Cobrado</span><span>Clientes</span><span style="text-align:right">Por cobrar</span>
    </div>`;

  for(const ev of proximos.slice(0,12)){
    const rs = reservCache.filter(r=>r.fields.Evento?.[0]===ev.id);
    const cob = rs.reduce((a,r)=>a+(r.fields['Total abonado']||0),0);
    const tot = rs.reduce((a,r)=>a+(r.fields['Total a pagar']||0),0);
    const pct = tot>0?Math.round(cob/tot*100):0;
    const falta = tot-cob;
    const bc = pct>=80?'':pct>=50?' warn':' danger';
    const mc = pct>=80?'var(--verde)':pct>=50?'var(--amarillo)':'var(--rojo)';
    html+=`<div class="ev-row">
      <span style="font-size:13px;font-weight:600">${ev.fields.Nombre}</span>
      <span style="font-size:11px;color:var(--texto-sec)">${fecha(ev.fields.Fecha)}</span>
      <div><div class="bar-wrap"><div class="bar-fill${bc}" style="width:${pct}%"></div></div></div>
      <span style="font-size:11px;color:var(--texto-sec)">${rs.length} clientes</span>
      <span style="font-size:12px;font-weight:700;text-align:right;color:${mc}">${pesos(falta)}</span>
    </div>`;
  }

  html+=`</div></div><div class="two-col">
  <div class="card"><div class="card-title">Últimos pagos</div>`;
  [...pagos].sort((a,b)=>new Date(b.createdTime)-new Date(a.createdTime)).slice(0,5).forEach(p=>{
    html+=`<div class="alerta-row"><div class="alerta-dot" style="background:var(--verde)"></div>
      <span style="flex:1;font-size:12px">${p.fields.Referencia||'Pago'}</span>
      <span class="badge badge-verde">${pesos(p.fields.Monto)}</span></div>`;
  });
  html+=`</div><div class="card"><div class="card-title">Por ciudad</div>`;
  ['MTY','CDMX'].forEach(ciudad=>{
    const rs=reservCache.filter(r=>eventosCache.find(e=>e.id===r.fields.Evento?.[0])?.fields.Ciudad===ciudad);
    const cob=rs.reduce((a,r)=>a+(r.fields['Total abonado']||0),0);
    html+=`<div class="alerta-row"><div class="alerta-dot" style="background:${ciudad==='MTY'?'#4488ff':'var(--rojo)'}"></div>
      <span style="flex:1;font-size:13px;font-weight:600">${ciudad}</span>
      <span style="font-size:11px;color:var(--texto-sec);margin-right:8px">${rs.length} reserv.</span>
      <span style="font-size:13px;font-weight:700">${pesos(cob)}</span></div>`;
  });
  html+=`</div></div>`;
  document.getElementById('view-resumen').innerHTML=html;
}

async function loadEvento(eventoId) {
  if(!eventoId){document.getElementById('evento-content').innerHTML='';return;}
  document.getElementById('evento-content').innerHTML='<div class="loading"><div class="spinner"></div>Cargando...</div>';
  const ev=eventosCache.find(e=>e.id===eventoId);
  const rs=reservCache.filter(r=>r.fields.Evento?.[0]===eventoId);
  const showFin=currentRole==='admin'||currentRole==='auxiliar';

  // Cargar pagos para calcular abonado real
  const pagosEv = await atFetch('Pagos');
  const reservIds = new Set(rs.map(r=>r.id));
  const pagosPorReserv = {};
  for(const p of pagosEv){
    const rid = p.fields['Reservación']?.[0];
    if(rid && reservIds.has(rid)){
      pagosPorReserv[rid] = (pagosPorReserv[rid]||0) + (p.fields.Monto||0);
    }
  }

  const cob=rs.reduce((a,r)=>a+(pagosPorReserv[r.id]||0),0);
  const tot=rs.reduce((a,r)=>a+(r.fields['Total a pagar']||0),0);

  let html='';
  if(showFin){
    html+=`<div class="metrics-grid">
      <div class="metric-card azul"><div class="metric-label">Clientes</div><div class="metric-val">${rs.length}</div></div>
      <div class="metric-card verde"><div class="metric-label">Cobrado</div><div class="metric-val">${pesos(cob)}</div></div>
      <div class="metric-card ${tot-cob>0?'rojo':'verde'}"><div class="metric-label">Por cobrar</div><div class="metric-val">${pesos(tot-cob)}</div></div>
      <div class="metric-card amarillo"><div class="metric-label">Total esperado</div><div class="metric-val">${pesos(tot)}</div></div>
    </div>`;
  } else {
    html+=`<div class="metrics-grid" style="grid-template-columns:1fr 1fr">
      <div class="metric-card azul"><div class="metric-label">Clientes</div><div class="metric-val">${rs.length}</div></div>
      <div class="metric-card amarillo"><div class="metric-label">Ciudad</div><div class="metric-val" style="font-size:24px">${ev?.fields.Ciudad||'—'}</div></div>
    </div>`;
  }

  const clientesMap = clientesCache;

  html+=`<div class="card"><div class="card-title">Lista de viajeros — ${ev?.fields.Nombre||''}</div>
  <div style="overflow-x:auto"><table><thead><tr>
    <th>Nombre</th><th>Paquete</th><th>Zona</th><th>Habitación</th><th>Comparte con</th><th>Talla</th><th>Teléfono</th><th>Correo</th><th>Emergencia</th>`;
  if(showFin) html+=`<th style="text-align:right">Total</th><th style="text-align:right">Abonado</th><th style="text-align:right">Resta</th><th>Status</th>`;
  html+=`</tr></thead><tbody>`;

  for(const r of rs){
    const cl=clientesMap[r.fields.Cliente?.[0]]||{};
    const paq=r.fields.Paquete||'—';
    const pc=paq==='PLUS'?'badge-verde':paq==='RIDE'?'badge-azul':paq==='CHEAP'?'badge-amarillo':'badge-gris';
    const t=r.fields['Total a pagar']||0;
    const a=pagosPorReserv[r.id]||0;
    const re=t-a;
    const st=r.fields['Status pago']||'';
    const stc=st==='Liquidado'?'badge-verde':st==='Baja'?'badge-rojo':st==='Saldo pendiente'?'badge-amarillo':'badge-gris';
    html+=`<tr>
      <td style="font-weight:600;min-width:160px">${cl['Nombre completo']||'—'}</td>
      <td><span class="badge ${pc}">${paq}</span></td>
      <td style="font-size:12px;color:var(--texto-sec);min-width:80px">${r.fields['Zona / Boleto']||'—'}</td>
      <td style="font-size:12px;min-width:90px">${r.fields['Habitación']||'—'}</td>
      <td style="font-size:11px;color:var(--texto-sec);min-width:120px">${r.fields['Comparte habitación con']||'—'}</td>
      <td style="font-size:12px;text-align:center">${cl['Talla de playera']||'—'}</td>
      <td style="font-size:12px;color:var(--texto-sec);min-width:100px">${cl['Teléfono']||'—'}</td>
      <td style="font-size:11px;color:var(--texto-sec);min-width:160px">${cl['Correo electrónico']||'—'}</td>
      <td style="font-size:11px;color:var(--texto-sec);min-width:140px">${cl['Contacto de emergencia']||'—'}</td>`;
    if(showFin) html+=`
      <td style="text-align:right;font-size:12px;min-width:70px">${pesos(t)}</td>
      <td style="text-align:right;font-size:12px;min-width:70px;color:var(--verde)">${pesos(a)}</td>
      <td style="text-align:right;min-width:70px"><span class="badge ${re<=0?'badge-verde':re>2000?'badge-rojo':'badge-amarillo'}">${pesos(re)}</span></td>
      <td><span class="badge ${stc}">${st||'—'}</span></td>`;
    html+=`</tr>`;
  }
  html+=`</tbody></table></div></div>`;
  document.getElementById('evento-content').innerHTML=html;
}

async function loadPagosRecientes(){
  const pagos=await atFetch('Pagos','&sort%5B0%5D%5Bfield%5D=createdTime&sort%5B0%5D%5Bdirection%5D=desc&maxRecords=8');
  let html='';
  pagos.forEach(p=>{
    html+=`<div class="alerta-row"><div class="alerta-dot" style="background:var(--verde)"></div>
      <span style="flex:1;font-size:13px">${p.fields.Referencia||'Pago'}</span>
      <span style="font-size:11px;color:var(--texto-sec);margin-right:8px">${new Date(p.createdTime).toLocaleDateString('es-MX',{day:'numeric',month:'short'})}</span>
      <span class="badge badge-verde">${pesos(p.fields.Monto)}</span></div>`;
  });
  document.getElementById('pagos-recientes').innerHTML=html||'<div style="color:var(--texto-sec);font-size:13px">Sin pagos</div>';
}

async function registrarPago(){
  const cliente=document.getElementById('pago-cliente').value.trim();
  const eventoId=document.getElementById('pago-evento').value;
  const monto=parseFloat(document.getElementById('pago-monto').value);
  const metodo=document.getElementById('pago-metodo').value;
  const ref=document.getElementById('pago-ref').value.trim();
  const msg=document.getElementById('pago-msg');
  if(!cliente||!eventoId||!monto){
    msg.style.display='block';msg.style.color='var(--rojo)';msg.textContent='Completa cliente, evento y monto.';return;
  }
  msg.style.display='block';msg.style.color='var(--texto-sec)';msg.textContent='Registrando...';
  const res=await atPost('Pagos',{
    Monto:monto, Método:metodo,
    
    Referencia:ref||`${cliente} — ${eventosCache.find(e=>e.id===eventoId)?.fields.Nombre||''}`,
  });
  if(res.records){
    msg.style.color='var(--verde)';msg.textContent=`✓ Pago de ${pesos(monto)} registrado`;
    document.getElementById('pago-monto').value='';document.getElementById('pago-ref').value='';
    loadPagosRecientes();
  } else {
    msg.style.color='var(--rojo)';msg.textContent='Error al registrar. Intenta de nuevo.';
  }
}

function loadVendedor(){
  const proximos=eventosCache.filter(e=>e.fields.Status==='Próximo');
  let html=`<div class="card"><div class="card-title">Costos de paquetes — próximos eventos</div>
  <table><thead><tr><th style="width:35%">Evento</th><th>Fecha</th><th>Ciudad</th>
  <th style="text-align:right">PLUS</th><th style="text-align:right">RIDE</th><th style="text-align:right">CHEAP</th>
  </tr></thead><tbody>`;
  proximos.forEach(ev=>{
    html+=`<tr>
      <td style="font-weight:600">${ev.fields.Nombre}</td>
      <td style="font-size:12px;color:var(--texto-sec)">${fecha(ev.fields.Fecha)}</td>
      <td><span class="badge ${ev.fields.Ciudad==='MTY'?'badge-azul':'badge-rojo'}">${ev.fields.Ciudad}</span></td>
      <td style="text-align:right;font-weight:600">${ev.fields['Precio PLUS']?pesos(ev.fields['Precio PLUS']):'—'}</td>
      <td style="text-align:right">${pesos(ev.fields['Precio RIDE'])}</td>
      <td style="text-align:right">${pesos(ev.fields['Precio CHEAP'])}</td>
    </tr>`;
  });
  html+=`</tbody></table></div>`;
  document.getElementById('vendedor-content').innerHTML=html;
}

function initGastos() {
  // Set today date
  const fd = document.getElementById('g-fecha');
  if(fd && !fd.value) fd.value = new Date().toISOString().split('T')[0];
  // Popular selector eventos
  const sel = document.getElementById('g-evento');
  if(!sel) return;
  while(sel.options.length > 1) sel.remove(1);
  eventosCache.forEach(e => {
    const opt = document.createElement('option');
    opt.value = e.id;
    opt.textContent = e.fields.Nombre || e.id;
    sel.appendChild(opt);
  });
  loadGastos();
}

async function loadGastos() {
  const gastos = await atFetch('Gastos');
  const eventosMap = {};
  eventosCache.forEach(e => eventosMap[e.id] = e.fields.Nombre);

  const totales = {};
  let totalGeneral = 0;
  gastos.forEach(g => {
    const cat = g.fields['Tipo'] || 'Otro';
    const monto = g.fields.Monto || 0;
    totales[cat] = (totales[cat]||0) + monto;
    totalGeneral += monto;
  });

  let html = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:16px">';
  Object.entries(totales).sort((a,b)=>b[1]-a[1]).forEach(([cat,tot]) => {
    html += `<div style="background:var(--negro-suave);border-radius:6px;padding:10px 12px">
      <div style="font-size:11px;color:var(--texto-sec)">${cat}</div>
      <div style="font-size:16px;font-weight:700;color:var(--rojo)">${pesos(tot)}</div>
    </div>`;
  });
  html += `<div style="background:var(--negro-suave);border-radius:6px;padding:10px 12px;border:1px solid rgba(255,193,7,.3)">
    <div style="font-size:11px;color:var(--texto-sec)">TOTAL GASTOS</div>
    <div style="font-size:16px;font-weight:700;color:var(--amarillo)">${pesos(totalGeneral)}</div>
  </div></div>`;

  if(gastos.length === 0) {
    document.getElementById('gastos-lista').innerHTML='<div style="color:var(--texto-sec);font-size:13px">Sin gastos registrados aún.</div>';
    return;
  }

  html += '<div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th>Evento</th><th style="text-align:right">Monto</th><th>Notas</th></tr></thead><tbody>';
  gastos.forEach(g => {
    const f = g.fields;
    const ev = f.Evento?.[0] ? (eventosMap[f.Evento[0]]||'—') : 'General';
    html += `<tr>
      <td style="font-size:12px;color:var(--texto-sec)">${f['Fecha']||'—'}</td>
      <td style="font-weight:600">${f.Concepto||'—'}</td>
      <td><span class="badge badge-gris">${f['Tipo']||'—'}</span></td>
      <td style="font-size:12px;color:var(--texto-sec)">${ev}</td>
      <td style="text-align:right;color:var(--rojo);font-weight:600">${pesos(f.Monto||0)}</td>
      <td style="font-size:12px;color:var(--texto-sec)">${f.Notas||'—'}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  document.getElementById('gastos-lista').innerHTML = html;
}

async function registrarGasto() {
  const concepto = document.getElementById('g-concepto').value.trim();
  const monto = parseFloat(document.getElementById('g-monto').value);
  const categoria = document.getElementById('g-categoria').value;
  const fecha = document.getElementById('g-fecha').value;
  const eventoId = document.getElementById('g-evento').value;
  const notas = document.getElementById('g-notas').value.trim();
  const msg = document.getElementById('g-msg');

  if(!concepto || !monto || !categoria || !fecha) {
    msg.style.color='var(--rojo)';
    msg.textContent='Llena todos los campos obligatorios (*)';
    return;
  }
  msg.style.color='var(--texto-sec)';
  msg.textContent='Guardando...';

  const fields = {
    'Concepto': concepto,
    'Monto': Number(monto),
    'Tipo': categoria,
    'Fecha': fecha,
  };
  if(notas) fields['Notas'] = notas;
  if(eventoId) fields['Evento'] = [eventoId];

  const res = await atPost('Gastos', fields);
  if(res.id || res.records?.[0]?.id) {
    msg.style.color='var(--verde)';
    msg.textContent='✓ Gasto registrado';
    document.getElementById('g-concepto').value='';
    document.getElementById('g-monto').value='';
    document.getElementById('g-notas').value='';
    loadGastos();
  } else {
    msg.style.color='var(--rojo)';
    msg.textContent='Error: ' + JSON.stringify(res);
  }
}

</script>
</body>
</html>
