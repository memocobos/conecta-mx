<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Tu contrato de viaje · Conecta Reynosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/icon-192.png">
<style>
  /* CONTRATO-CLIENTE-1 · esqueleto y marca de contrato-viajero.html (F2a). */
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;color:#222;background:#e9eaee;line-height:1.55;-webkit-font-smoothing:antialiased}
  :root{--amarillo:#e8ff4c;--rojo:#ff283b;--verde:#1a9e57;--border:#d8d8d8}
  .doc{background:#fff;padding:30px 20px 26px;max-width:820px;margin:0 auto}
  @media (min-width:760px){.doc{padding:56px 70px 50px;margin:32px auto;box-shadow:0 8px 60px rgba(0,0,0,.12);border:1px solid var(--border)}}
  .doc-header{text-align:center;border-bottom:3px solid #000;padding-bottom:22px;margin-bottom:26px}
  .doc-header .logo{display:block;margin:0 auto 18px;width:220px;max-width:70%;height:auto}
  .doc-header h1{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-size:26px;line-height:1.1;margin:0 0 6px;color:#000;font-weight:900}
  .doc-header .sub{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-size:13px;color:var(--rojo);font-weight:800;letter-spacing:.14em;margin:0}
  .doc-meta{background:#fafafa;border-left:6px solid var(--amarillo);padding:16px 20px;margin-bottom:22px;display:flex;flex-direction:column;gap:7px}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px;font-size:13.5px;align-items:baseline}
  .meta-row .lbl{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;color:var(--rojo);font-weight:800;letter-spacing:.1em;font-size:11px;min-width:80px}
  .meta-row .val{color:#000;font-weight:700}
  .clausula{margin-top:22px}
  .clausula h2{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-size:19px;margin:0 0 8px;color:#000;border-bottom:2px solid #000;padding-bottom:5px}
  .clausula h2 .num{color:var(--rojo);font-weight:900;margin-right:10px}
  .clausula p{font-size:14px;line-height:1.7;margin:0 0 9px;color:#1a1a1a}
  .clausula.anexo{border-top:3px solid #000;padding-top:16px;margin-top:30px}
  .firma{margin-top:32px;padding:22px 20px;background:#000;color:#fff}
  .firma h3{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-size:22px;color:var(--amarillo);margin:0 0 6px}
  .firma .hint{font-size:12.5px;color:rgba(255,255,255,.65);margin:0 0 16px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-size:12px;letter-spacing:.1em;color:rgba(255,255,255,.7);font-weight:800;margin-bottom:5px}
  .fld input,.fld select{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.25);color:#fff;padding:12px 14px;font-size:15px;font-family:inherit;border-radius:0}
  .fld select option{color:#000}
  .check{display:flex;gap:12px;align-items:flex-start;background:#fafafa;color:#000;padding:14px 16px;border-left:4px solid var(--amarillo);font-size:13.5px}
  .check input{width:20px;height:20px;flex:0 0 20px;margin-top:2px;accent-color:#000}
  .btn{width:100%;margin-top:18px;background:var(--amarillo);color:#000;border:0;padding:17px;font-weight:900;font-size:16px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-family:inherit}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .err{display:none;margin-top:12px;padding:11px 13px;background:rgba(255,40,59,.15);border:1px solid var(--rojo);color:#ffb3ba;font-size:13px}
  .err.show{display:block}
  .sello{margin-top:30px;background:#e6f6ee;border:1px solid #9ad9b8;padding:18px 20px;font-size:14px;line-height:1.6}
  .sello b{color:var(--verde)}
  .estado{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;background:#000;color:#fff}
  .estado h1{font-family:'Barlow Condensed',sans-serif;font-size:40px;text-transform:uppercase;color:var(--amarillo);margin:14px 0 10px}
  .estado p{max-width:420px;color:rgba(255,255,255,.75);font-size:15px}
  footer{padding:22px;text-align:center;font-size:11px;color:#666;letter-spacing:.12em;text-transform:uppercase}
  @media print{.firma,footer{display:none}body{background:#fff}.doc{box-shadow:none;border:0;margin:0}}
</style>
</head>
<body>
<div id="app"><div class="estado"><p>Cargando tu contrato…</p></div></div>
<footer>Conecta Reynosa · WhatsApp 81 1977 1072</footer>
<script>
(function () {
  var API = '/.netlify/functions/contrato-cliente';
  var token = (new URLSearchParams(location.search).get('t') || '').trim().toLowerCase();
  var app = document.getElementById('app');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pantalla(titulo, texto) { app.innerHTML = '<div class="estado"><h1>' + esc(titulo) + '</h1><p>' + esc(texto) + '</p></div>'; }
  function llamar(cuerpo) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j._status = r.status; return j; }); });
  }
  var ROL_TXT = { titular: 'el viajero', madre: 'su mamá', padre: 'su papá', tutor: 'su tutor' };
  function fechaMx(iso) { try { return new Date(iso).toLocaleString('es-MX', { timeZone: 'America/Matamoros', dateStyle: 'long', timeStyle: 'short' }); } catch (e) { return iso; } }

  function pintar(c) {
    var cab = '<div class="doc-header"><img class="logo" src="/imgs/logo-conecta-mx.png" alt="Conecta Reynosa" onerror="this.style.display=\'none\'">'
      + '<h1>Contrato de servicio de viaje</h1><p class="sub">' + esc(c.datos && c.datos.evento || '') + '</p></div>';
    var pie;
    if (c.estado === 'firmado') {
      pie = '<div class="sello">✅ <b>Contrato firmado</b> por ' + esc(c.firmante_nombre) + ' (' + esc(ROL_TXT[c.firmante_rol] || c.firmante_rol) + ') el ' + esc(fechaMx(c.firmado_at)) + '. Puedes guardar esta página: este es tu contrato.</div>';
    } else {
      pie = '<section class="firma" id="firma"><h3>Firma tu contrato</h3>'
        + '<p class="hint">Escribe tu nombre completo y acepta. Si el viajero es menor de edad, firma su mamá, papá o tutor.</p>'
        + '<div class="fld"><label for="f-rol">¿Quién firma?</label><select id="f-rol"><option value="">— elige —</option>'
        + '<option value="titular">Soy el viajero (mayor de edad)</option><option value="madre">Soy su mamá</option><option value="padre">Soy su papá</option><option value="tutor">Soy su tutor</option></select></div>'
        + '<div class="fld"><label for="f-nombre">Tu nombre completo</label><input id="f-nombre" autocomplete="name" maxlength="120" placeholder="Nombre y apellidos"></div>'
        + '<label class="check"><input type="checkbox" id="f-acepto"><span>Leí todo el contrato y acepto sus cláusulas.</span></label>'
        + '<button class="btn" id="f-btn" type="button">Firmar contrato</button><div class="err" id="f-err"></div></section>';
    }
    app.innerHTML = '<div class="doc">' + cab + c.html + pie + '</div>';
    var btn = document.getElementById('f-btn');
    if (btn) btn.onclick = firmar;
  }

  function firmar() {
    var err = document.getElementById('f-err'), btn = document.getElementById('f-btn');
    var rol = document.getElementById('f-rol').value;
    var nombre = document.getElementById('f-nombre').value.replace(/\s+/g, ' ').trim();
    var acepto = document.getElementById('f-acepto').checked;
    var falta = !rol ? 'Elige quién firma.' : (nombre.split(' ').length < 2 ? 'Escribe tu nombre completo (nombre y apellido).' : (!acepto ? 'Marca la casilla de que leíste y aceptas.' : ''));
    if (falta) { err.textContent = falta; err.classList.add('show'); return; }
    err.classList.remove('show'); btn.disabled = true; btn.textContent = 'Firmando…';
    llamar({ accion: 'firmar', token: token, nombre: nombre, rol: rol, acepto: true }).then(function (r) {
      if (!r.ok) { err.textContent = r.error || 'No se pudo firmar. Intenta de nuevo.'; err.classList.add('show'); btn.disabled = false; btn.textContent = 'Firmar contrato'; return; }
      cargar(true);
    }).catch(function () { err.textContent = 'Sin conexión. Intenta de nuevo.'; err.classList.add('show'); btn.disabled = false; btn.textContent = 'Firmar contrato'; });
  }

  function cargar(recienFirmado) {
    if (!/^[a-f0-9]{48}$/.test(token)) { pantalla('Link incompleto', 'Abre el link completo que te llegó por correo. Si no lo encuentras, escríbenos por WhatsApp.'); return; }
    llamar({ accion: 'ver', token: token }).then(function (r) {
      if (!r.ok) { pantalla(r._status === 410 ? 'Contrato reemplazado' : 'No lo encontramos', r.error || 'Intenta de nuevo en un momento.'); return; }
      pintar(r);
      if (recienFirmado) window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }).catch(function () { pantalla('Sin conexión', 'No pudimos cargar tu contrato. Revisa tu internet e intenta de nuevo.'); });
  }
  cargar(false);
})();
</script>
</body>
</html>
