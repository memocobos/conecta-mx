<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Contrato de colaboración · Conecta Reynosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/icon-192.png">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;
    color:#222;
    background:#e9eaee;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
  }
  :root{
    --negro:#000;
    --blanco:#fff;
    --amarillo:#e8ff4c;
    --rojo:#ff283b;
    --azul:#0000cd;
    --gris:#9a9a9a;
    --gris-claro:#e6e6e6;
    --border:#d8d8d8;
  }

  /* ── Pantallas de estado ── */
  .state-screen{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 24px;text-align:center;background:#000;color:#fff;
  }
  .state-screen h1{font-family:'Barlow Condensed',sans-serif;font-size:48px;line-height:.9;text-transform:uppercase;margin:24px 0 12px;color:var(--amarillo)}
  .state-screen p{max-width:380px;color:rgba(255,255,255,.7);font-size:15px;margin:0 0 24px}
  .state-screen .badge-tag{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:700}
  .state-screen a.btn-link{display:inline-block;background:var(--amarillo);color:#000;padding:14px 28px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;font-size:14px}

  /* ── Documento ── */
  .container{max-width:820px;margin:0 auto;padding:0}
  .doc{background:#fff;padding:34px 22px 28px;min-height:60vh}
  @media (min-width:760px){
    .doc{padding:60px 72px 56px;margin:32px auto;box-shadow:0 8px 60px rgba(0,0,0,.12);border:1px solid var(--border)}
  }

  /* ── Header del documento ── */
  .doc-header{
    text-align:center;
    border-bottom:3px solid #000;
    padding-bottom:24px;
    margin-bottom:30px;
  }
  .doc-header .logo{
    display:block;
    margin:0 auto 22px;
    width:240px;
    max-width:75%;
    height:auto;
  }
  .doc-header h1{
    font-family:'Barlow Condensed','Montserrat',sans-serif;
    text-transform:uppercase;
    font-size:24px;
    line-height:1.15;
    letter-spacing:.02em;
    color:#000;
    margin:0 0 6px;
    font-weight:800;
  }
  .doc-header .subtitle{
    font-family:'Barlow Condensed','Montserrat',sans-serif;
    text-transform:uppercase;
    font-size:14px;
    color:var(--rojo);
    font-weight:800;
    letter-spacing:.14em;
    margin:0;
  }
  @media (min-width:760px){
    .doc-header h1{font-size:30px}
  }

  /* ── Bloque meta ── */
  .doc-meta{
    background:#fafafa;
    border-left:6px solid var(--amarillo);
    border-radius:0;
    padding:18px 22px;
    margin-bottom:30px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .doc-meta .meta-row{
    display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;
    font-size:13.5px;
  }
  .doc-meta .meta-row .lbl{
    font-family:'Barlow Condensed',sans-serif;
    text-transform:uppercase;
    color:var(--rojo);
    font-weight:800;
    letter-spacing:.1em;
    font-size:11px;
    min-width:165px;
  }
  .doc-meta .meta-row .val{color:#000;font-weight:700}

  /* ── Cláusulas ── */
  .clausula{margin-top:30px}
  .clausula h2{
    font-family:'Barlow Condensed','Montserrat',sans-serif;
    text-transform:uppercase;
    font-size:22px;
    letter-spacing:.04em;
    margin:0 0 12px;
    color:#000;
    border-bottom:2px solid #000;
    padding-bottom:6px;
    line-height:1.15;
  }
  .clausula h2 .num{color:var(--rojo);font-weight:900;margin-right:10px}
  .clausula p{font-size:14px;line-height:1.7;margin:0 0 10px;color:#1a1a1a}
  .clausula ul, .clausula ol{padding-left:22px;margin:8px 0 14px}
  .clausula li{font-size:14px;line-height:1.7;margin-bottom:6px}
  .clausula .subseccion{
    font-family:'Barlow Condensed','Montserrat',sans-serif;
    text-transform:uppercase;
    font-size:14px;
    letter-spacing:.05em;
    color:#000;
    font-weight:800;
    margin:18px 0 8px;
  }
  .clausula .subseccion .num{color:var(--rojo);margin-right:6px;font-weight:900}
  .clausula .multa{font-weight:800;color:var(--rojo)}

  .item-list{margin:8px 0 14px;padding:0;list-style:none;border:1px solid var(--border);background:#fafafa}
  .item-list li{display:flex;align-items:flex-start;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);font-size:14px}
  .item-list li:last-child{border-bottom:0}
  .item-list li::before{content:'';width:8px;height:8px;background:var(--rojo);margin-top:8px;flex:0 0 8px;border-radius:0}

  /* ── Sección de firma (estado pendiente) ── */
  .firma-section{margin-top:40px;padding:24px 22px;background:#000;color:#fff;border-radius:0}
  .firma-section .panel-title{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-size:22px;letter-spacing:.05em;color:var(--amarillo);margin:0 0 14px;font-weight:800}
  .firma-section .panel-sub{font-size:12px;color:rgba(255,255,255,.65);margin:0 0 14px;line-height:1.5}
  .firma-acept{background:#fafafa;color:#000;padding:18px 20px;margin-bottom:20px;border-left:4px solid var(--amarillo);font-size:13px;line-height:1.6}
  .firma-acept b{font-weight:800}

  .canvas-wrap{background:#fff;border-radius:0;position:relative;border:2px dashed rgba(255,255,255,.18);overflow:hidden}
  #firmaCanvas{display:block;width:100%;height:200px;touch-action:none;cursor:crosshair;background:#fff}
  .canvas-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:rgba(255,255,255,.5)}
  .canvas-actions button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;padding:8px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;cursor:pointer;font-family:'Montserrat',sans-serif;border-radius:0}
  .canvas-actions button:hover{background:rgba(255,255,255,.05)}

  .ine-section{margin-top:28px}
  .ine-uploads{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .ine-uploads label{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;border:2px dashed rgba(255,255,255,.25);padding:24px 12px;text-align:center;font-size:12px;cursor:pointer;background:rgba(255,255,255,.03);position:relative;overflow:hidden;min-height:130px;transition:border-color .2s,background .2s}
  .ine-uploads label:hover{border-color:var(--amarillo);background:rgba(232,255,76,.08)}
  .ine-uploads label.has-file{border-style:solid;border-color:var(--amarillo);padding:0}
  .ine-uploads label .lbl-title{font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:rgba(255,255,255,.85)}
  .ine-uploads label .lbl-hint{font-size:10px;color:rgba(255,255,255,.45);letter-spacing:.06em}
  .ine-uploads label .preview-img{width:100%;height:130px;object-fit:cover;display:block}
  .ine-uploads input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

  .check-section{margin-top:22px;display:flex;gap:12px;align-items:flex-start;font-size:13px;line-height:1.5;color:rgba(255,255,255,.85)}
  .check-section input{margin-top:3px;width:18px;height:18px;flex:0 0 18px;accent-color:var(--amarillo)}

  .submit-area{margin-top:26px}
  .btn-submit{width:100%;background:var(--amarillo);color:#000;border:0;padding:18px;font-weight:900;font-size:16px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-family:'Montserrat',sans-serif;border-radius:0}
  .btn-submit:disabled{opacity:.5;cursor:not-allowed}
  .btn-submit:active:not(:disabled){transform:translateY(1px)}
  .form-err{display:none;margin-top:14px;padding:12px 14px;background:rgba(255,40,59,.15);border:1px solid var(--rojo);color:#ffb3ba;font-size:13px}
  .form-err.show{display:block}

  /* ── Firmas RENDERIZADAS (vista firmada) ── */
  .firmas-rendered{margin-top:46px;border-top:3px solid #000;padding-top:26px}
  .firmas-rendered .firmas-title{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-size:22px;letter-spacing:.04em;color:#000;margin:0 0 18px;font-weight:800}
  .firmas-rendered .firmas-title .num{color:var(--rojo);margin-right:10px;font-weight:900}
  .firmas-rendered .grid{display:grid;grid-template-columns:1fr;gap:34px}
  @media (min-width:640px){.firmas-rendered .grid{grid-template-columns:1fr 1fr}}
  .firma-block{display:flex;flex-direction:column;gap:8px}
  .firma-block .label-mini{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-size:11px;letter-spacing:.18em;color:#666;font-weight:700}
  .firma-block .firma-box{background:#fafafa;border:1px solid var(--border);padding:14px;min-height:130px;display:flex;align-items:center;justify-content:center}
  .firma-block .firma-box img{max-width:100%;max-height:140px}
  .firma-block .firma-nombre{font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-top:6px;font-size:14px;color:#000}
  .firma-block .firma-rol{font-size:11px;color:#666;letter-spacing:.1em;text-transform:uppercase;font-weight:700}

  .ine-rendered{margin-top:30px;padding-top:22px;border-top:1px dashed var(--border)}
  .ine-rendered .label-mini{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-size:11px;letter-spacing:.18em;color:#666;font-weight:700;margin-bottom:10px;display:block}
  .ine-rendered .ine-thumbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ine-rendered .ine-thumbs a{display:block;border:1px solid var(--border);overflow:hidden;background:#fafafa}
  .ine-rendered .ine-thumbs img{width:100%;height:130px;object-fit:cover;display:block}

  /* Footer */
  footer.doc-footer{padding:24px 24px 40px;text-align:center;font-size:11px;color:#666;letter-spacing:.14em;text-transform:uppercase;font-family:'Montserrat',sans-serif}
  footer.doc-footer a{color:var(--rojo);text-decoration:none;font-weight:800}

  .loading{min-height:60vh;display:flex;align-items:center;justify-content:center;color:#666;font-size:13px;letter-spacing:.16em;text-transform:uppercase}
  @keyframes ctr-spin { to { transform: rotate(360deg) } }

  /* Sección "Aceptación del Creador" */
  .firma-creador-intro{
    background:rgba(232,255,76,.18);
    border-left:5px solid var(--amarillo);
    padding:16px 20px;
    margin-bottom:18px;
    color:#000;
    font-size:13.5px;
    line-height:1.65;
  }
  .firma-creador-intro b{font-weight:800}

  /* Barra de descarga PDF — solo vista firmada */
  .print-bar{max-width:820px;margin:20px auto 0;padding:0 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .print-btn{background:#000;color:#fff;border:0;padding:11px 20px;font-weight:800;font-size:13px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;font-family:'Montserrat',sans-serif;border-radius:0}
  .print-btn:hover{background:var(--rojo)}
  .print-tip{font-size:12px;color:#666;font-family:'Montserrat',sans-serif}

  /* Print */
  @media print{
    body{background:#fff}
    .doc{box-shadow:none;border:none;padding:0 8px;margin:0;max-width:100%}
    .firma-section,footer.doc-footer{display:none !important}
    .print-bar{display:none !important}
    @page{size:letter;margin:14mm}
    section,.firma-block,.ine-rendered,h2,h3{break-inside:avoid}
    .firma-box,.ine-rendered{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .firma-box img,.ine-thumbs img{max-width:100%;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    a{color:inherit;text-decoration:none}
  }
</style>
</head>
<body>

<div id="root">
  <div class="loading">Cargando contrato…</div>
</div>

<script>
const API_OBTENER  = "/.netlify/functions/contrato-obtener";
const API_FIRMAR   = "/.netlify/functions/contrato-firmar";
const API_DEBUG_LOG = "/.netlify/functions/contrato-debug-log";
const FIRMA_GUILLERMO_SRC = "/imgs/firma-guillermo.png";
const LOGO_SRC = "/imgs/logo-conecta-mx.png";

function $q(sel, el) { return (el || document).querySelector(sel); }
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtFechaLarga(iso) {
  if (!iso) return "—";
  const [y, m, d] = String(iso).split("-");
  if (!y || !m || !d) return iso;
  const meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  return `${parseInt(d,10)} de ${meses[parseInt(m,10)-1] || ""} de ${y}`;
}
function fmtFechaCorta(iso) {
  // Formato DD/MM/AA
  if (!iso) return "—";
  const [y, m, d] = String(iso).split("-");
  if (!y || !m || !d) return iso;
  return `${d}/${m}/${y.slice(-2)}`;
}
function getToken() {
  const u = new URLSearchParams(location.search);
  return (u.get("t") || u.get("token") || "").trim();
}

const FOOTER = `
  <footer class="doc-footer">
    Conecta Reynosa · <a href="https://conectareynosa.mx">conectareynosa.mx</a> · RFC: COVG850924BB6<br>
    Guillermo Alexander Cobos Vizcarra · Viaja con Expertos
  </footer>`;

// ── Cláusulas legales — replica exacta del PDF + agregados ─────────────
const CLAUSULAS = [
  {
    num: 1, titulo: "Objeto del contrato",
    cuerpo: c => `<p>El presente Contrato regula la colaboración entre <b>CONECTA REYNOSA</b> (en adelante, "la Agencia") y <b class="creador-strong">${escapeHtml(c.creador_nombre)}</b> (en adelante, "el Creador de Contenido"), mediante un intercambio que incluye beneficios detallados en la cláusula 5, a cambio de la generación y entrega de contenido audiovisual bajo las condiciones descritas en este documento.</p>`
  },
  {
    num: 2, titulo: "Detalle del intercambio",
    cuerpo: c => `
<div class="subseccion">2.1 Lo que ofrece la Agencia:</div>
<div class="item-list-ofrecimiento"></div>
<div class="subseccion">2.2 Lo que se espera del Creador de Contenido:</div>
<div class="item-list-expectativas"></div>`
  },
  {
    num: 3, titulo: "Propiedad del contenido",
    cuerpo: () => `
<ul>
  <li>Todo el contenido generado será de propiedad exclusiva de la Agencia.</li>
  <li>Solo la Agencia podrá distribuir, publicar y usar el contenido en sus plataformas.</li>
  <li>Cualquier publicación por parte del Creador de Contenido deberá ser etiquetada como colaboración oficial con la Agencia.</li>
</ul>`
  },
  {
    num: 4, titulo: "Requisitos del contenido",
    cuerpo: () => `
<div class="subseccion"><span class="num">4.1</span> Calidad y formato del contenido</div>
<ol>
  <li><b>Calidad técnica:</b> Material en HD o 4K. Cualquier material de calidad inferior será rechazado.</li>
  <li><b>Formato:</b> Videos en formato Reel o video vertical para redes sociales (1080 × 1920 píxeles).</li>
  <li><b>Iluminación y presentación:</b> Todo contenido, incluidas las menciones durante el evento, deberá tener buena iluminación, claridad y demostrar que el Creador está disfrutando una experiencia increíble.</li>
</ol>

<div class="subseccion"><span class="num">4.2</span> Requisitos de la voz</div>
<ol>
  <li><b>Audición clara:</b> La voz en los videos debe ser claramente audible, sin ruidos de fondo que interfieran con el mensaje.</li>
  <li><b>Buena dicción:</b> El Creador deberá hablar de manera clara y entendible, sin errores que dificulten la comprensión del mensaje.</li>
  <li><b>Tono respetuoso:</b> El lenguaje y tono utilizados deben ser respetuosos y acordes al profesionalismo de la Agencia.</li>
  <li><b>Adecuación:</b> La voz deberá ajustarse al propósito del video (ya sea experiencia, comercial o contenido extra) y ser funcional para nuestras plataformas y campañas.</li>
</ol>

<div class="subseccion"><span class="num">4.3</span> Historias y publicaciones</div>
<ol>
  <li>Las menciones en el evento deberán publicarse como historias en <b>Instagram y/o TikTok</b>.</li>
  <li>Las redes sociales del Creador deberán estar en modo <b>público</b> durante:
    <ul>
      <li>La duración del evento.</li>
      <li>Un lapso de <b>10 a 15 días</b> posteriores a la publicación del contenido.</li>
    </ul>
  </li>
  <li>En caso de incumplir estas indicaciones, se aplicarán las siguientes sanciones:
    <ul>
      <li>Multa del <span class="multa">25%</span> del costo del intercambio si la infracción ocurre por primera vez.</li>
      <li>Multa del <span class="multa">50%</span> del costo del intercambio si la infracción persiste.</li>
    </ul>
  </li>
</ol>

<div class="subseccion"><span class="num">4.4</span> Plazo de entrega</div>
<ol>
  <li>El contenido debe ser entregado de <b>2 a 3 días</b> después del evento.</li>
  <li>En caso de retraso después de los días de margen en la entrega:
    <ul>
      <li>Retraso de <b>1 a 7 días:</b> Multa del <span class="multa">25%</span>.</li>
      <li>Retraso de <b>7 a 10 días:</b> Multa del <span class="multa">50%</span>.</li>
      <li>Retraso de <b>10 a 15 días:</b> Multa del <span class="multa">75%</span>.</li>
      <li>Retraso mayor a <b>15 días:</b> Multa del <span class="multa">100%</span>.</li>
    </ul>
  </li>
</ol>

<div class="subseccion"><span class="num">4.5</span> Correcciones</div>
<ol>
  <li>Si el material es devuelto para correcciones, el Creador tiene <b>24 horas</b> para hacer los ajustes solicitados.</li>
  <li>Si no cumple con el plazo:
    <ul>
      <li><span class="multa">50%</span> del costo del intercambio será cobrado.</li>
      <li>Si ninguno de los videos cumple con las expectativas, la Agencia podrá cobrar el <span class="multa">100%</span> del costo del intercambio.</li>
    </ul>
  </li>
</ol>

<div class="subseccion"><span class="num">4.6</span> Exclusividad durante el evento</div>
<p>Durante el evento, el Creador no podrá promocionar a otras agencias competidoras o servicios similares de viajes a conciertos. El incumplimiento de esta cláusula resultará en la <b>cancelación inmediata del contrato</b> y el cobro del <span class="multa">100%</span> del valor comercial del intercambio.</p>

<div class="subseccion"><span class="num">4.7</span> Veto de contenido</div>
<p>La Agencia se reserva el derecho de solicitar la eliminación de contenido publicado que no cumpla con los estándares acordados, en un plazo máximo de <b>24 horas</b>. El no cumplimiento de esta solicitud resultará en multa del <span class="multa">50%</span> del valor del intercambio.</p>`
  },
  {
    num: 5, titulo: "Políticas de cancelación",
    cuerpo: () => `
<p>El contrato podrá cancelarse por las siguientes razones:</p>
<ol>
  <li><b>Incumplimiento de calidad:</b> Si el contenido no cumple con los requisitos establecidos (calidad técnica, iluminación, formato, menciones claras y positivas).</li>
  <li><b>Imagen pública:</b> Si el Creador está involucrado en polémicas, problemas legales o comportamientos que afecten la imagen de la Agencia.</li>
  <li><b>Redes sociales privadas:</b> Si el Creador no mantiene sus redes públicas durante el plazo estipulado.</li>
  <li><b>Entregas incumplidas:</b> Si el contenido no se entrega en tiempo y forma o no se realizan las correcciones solicitadas.</li>
  <li><b>Reembolso del intercambio:</b> En caso de incumplimiento total del Creador (no asistencia, no entrega de contenido), el Creador deberá reembolsar el valor comercial del intercambio dentro de <b>15 días naturales</b> contados a partir de la fecha del evento.</li>
</ol>`
  },
  {
    num: 6, titulo: "Beneficios para el Creador de Contenido",
    cuerpo: () => `
<ol>
  <li><b>Entradas:</b> Acceso al evento o festival en zonas de buena ubicación.</li>
  <li><b>Viaje y alojamiento</b> (si aplica): Transporte, traslados, kit Conecta, hospedaje y otros servicios según la logística del evento.</li>
  <li><b>Extras:</b> Otros beneficios serán detallados dependiendo del intercambio acordado.</li>
</ol>`
  },
  {
    num: 7, titulo: "Compromiso del Creador de Contenido",
    cuerpo: () => `
<p>El Creador de Contenido se compromete a:</p>
<ol>
  <li>Generar contenido que represente positivamente la experiencia del evento.</li>
  <li>Aceptar las solicitudes de colaboración etiquetada en redes sociales.</li>
  <li>Publicar historias y menciones durante el evento con buena calidad y en redes públicas.</li>

function _fillBlank(v) {

}
function _viaBCtx(c, opts) {

      : '1 (un) año a partir de tu firma',
    emNom: _fillBlank(em.nombre),
    emTel: _fillBlank(em.telefono),
    emPar: _fillBlank(em.parentesco),
    evento: escapeHtml(c.evento_nombre || ''),

    desglose: escapeHtml(String(d.desglose_premio || '__________')),

  };
}

// ── Canvas de firma ────────────────────────────────────────────────────
function setupFirmaCanvas() {
  const canvas = document.getElementById("firmaCanvas");
  if (!canvas) return null;
  const dpr = window.devicePixelRatio || 1;
  // Estado del canvas — declarado antes de fit() para evitar TDZ y para que
  // fit() pueda consultar hasInk al disparar el resize handler.
  let drawing = false, hasInk = false;

  function fit() {
    // CRÍTICO: si el usuario ya empezó a firmar, NO redimensionar — asignar
    // canvas.width borra todos los píxeles. En móvil, resize se dispara con
    // scroll (address bar), teclado y rotación. Sin este guard la firma
    // capturada termina siendo un PNG en blanco.
    if (hasInk) return;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = 200 * dpr;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.lineWidth = 2.4;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#111";
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  fit();
  window.addEventListener("resize", fit);
  const ctx = canvas.getContext("2d");
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function start(e) { e.preventDefault(); drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
  function move(e) { if (!drawing) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); hasInk = true; }
  function end() { drawing = false; }
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  canvas.addEventListener("mouseup", end);
  canvas.addEventListener("mouseleave", end);
  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  canvas.addEventListener("touchend", end);
  // clear() debe forzar el reset, así que reseteamos hasInk ANTES de fit().
  function doClear() { hasInk = false; fit(); }
  return {
    clear: doClear,
    hasInk: () => hasInk,
    setHasInk: v => { hasInk = v; },
    dataURL: () => canvas.toDataURL("image/png"),
  };
}

// Logger con prefijo para que se vea claro en consola del móvil.
const _log = (...args) => { try { console.log("[contrato]", ...args); } catch (_) {} };
const _logErr = (...args) => { try { console.warn("[contrato:ERROR]", ...args); } catch (_) {} };

// Dibuja una fuente decodificada (ImageBitmap o HTMLImageElement) en canvas y
// devuelve un data URL JPEG. Tira si las dimensiones son 0 o el canvas no copió.
function _drawToJpeg(source, maxDim, quality) {
  let w = source.width || source.naturalWidth;
  let h = source.height || source.naturalHeight;
  if (!w || !h) throw new Error("dimensiones 0");
  const longest = Math.max(w, h);
  if (longest > maxDim) {
    const r = maxDim / longest;
    w = Math.round(w * r);
    h = Math.round(h * r);
  }
  const cnv = document.createElement("canvas");
  cnv.width = w;
  cnv.height = h;
  const ctx = cnv.getContext("2d");
  if (!ctx) throw new Error("getContext null");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(source, 0, 0, w, h);
  const dataUrl = cnv.toDataURL("image/jpeg", quality);
  if (!dataUrl || dataUrl.length < 1000) {
    throw new Error("canvas produjo dataURL vacío (drawImage falló silenciosamente)");
  }
  return { dataUrl, w, h };
}

// Decodificador clásico: URL.createObjectURL + new Image. Funciona para JPEG/PNG
// en todos los navegadores; NO funciona para HEIC en iOS Safari (Image.onerror).
async function _decodeViaImage(file, maxDim, quality) {
  const objUrl = URL.createObjectURL(file);
  try {
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      const t = setTimeout(() => reject(new Error("timeout >15s")), 15000);
      i.onload = () => { clearTimeout(t); resolve(i); };
      i.onerror = () => { clearTimeout(t); reject(new Error("Image.onerror")); };
      i.src = objUrl;
    });
    return _drawToJpeg(img, maxDim, quality);
  } finally {
    URL.revokeObjectURL(objUrl);
  }
}

// Cadena de decodificación con 3 intentos:
//   1. createImageBitmap(file) — decodifica HEIC en iOS 15+ vía ImageIO de Apple.
//   2. URL.createObjectURL + new Image() — fallback para navegadores sin ImageBitmap.
//   3. _readAsDataUrl(file) crudo — SOLO si NO es HEIC y file.size < 2 MB.
// Devuelve { dataUrl, method, attempts }. Tira con e.attempts y e.isHeic en error.
async function _decodeToJpeg(file, maxDim = 1600, quality = 0.78) {
  const attempts = [];
  const isHeic = /^image\/(heic|heif)$/i.test(file.type || "");
  _log("decode start: type=" + (file.type || "(empty)") + " size=" + file.size +
    " (" + (file.size/1024/1024).toFixed(2) + " MB) | isHEIC=" + isHeic +
    " | maxDim=" + maxDim + " q=" + quality);

  // Intento 1: createImageBitmap.
  if (typeof createImageBitmap === "function") {
    let bmp = null;
    try {
      bmp = await createImageBitmap(file);
      const { dataUrl, w, h } = _drawToJpeg(bmp, maxDim, quality);
      attempts.push("createImageBitmap:ok");
      _log("✓ PATH=createImageBitmap | " + w + "x" + h + " | dataUrl=" + dataUrl.length);
      return { dataUrl, method: "createImageBitmap", attempts };
    } catch (e) {
      attempts.push("createImageBitmap:fail(" + (e.message || "?").slice(0,80) + ")");
      _logErr("createImageBitmap fail:", e.message);
    } finally {
      if (bmp && bmp.close) try { bmp.close(); } catch (_) {}
    }
  } else {
    attempts.push("createImageBitmap:unsupported");
  }

  // Intento 2: <img> + objectURL.
  try {
    const { dataUrl, w, h } = await _decodeViaImage(file, maxDim, quality);
    attempts.push("image:ok");
    _log("✓ PATH=image | " + w + "x" + h + " | dataUrl=" + dataUrl.length);
    return { dataUrl, method: "image", attempts };
  } catch (e) {
    attempts.push("image:fail(" + (e.message || "?").slice(0,80) + ")");
    _logErr("image decoder fail:", e.message);
  }

  // Intento 3: fallback crudo. Solo para no-HEIC pequeños — HEIC crudo no lo
  // puede mostrar el navegador después, y archivos grandes saturan el payload.
  if (isHeic) {
    attempts.push("fallback-raw:skipped(heic)");
    throw Object.assign(new Error("HEIC sin decoder disponible"), { attempts, isHeic: true });
  }
  if (file.size > 2 * 1024 * 1024) {
    attempts.push("fallback-raw:skipped(too-big)");
    throw Object.assign(new Error("decoder fail y file.size >2MB"), { attempts, isHeic: false });
  }
  try {
    const dataUrl = await _readAsDataUrl(file);
    attempts.push("fallback-raw:ok");
    _log("✓ PATH=fallback-raw (sin compresión) | dataUrl=" + dataUrl.length);
    return { dataUrl, method: "fallback-raw", attempts };
  } catch (e) {
    attempts.push("fallback-raw:fail(" + (e.message || "?").slice(0,80) + ")");
    throw Object.assign(new Error("Todos los decoders fallaron"), { attempts, isHeic: false });
  }
}

// Fallback: leer el archivo crudo y devolverlo como data URL en su formato
// original. Esto siempre funciona porque no toca canvas. El servidor acepta
// cualquier image/* mime después del fix de regex.
function _readAsDataUrl(file) {
  _logErr("⚠ PATH=fallback (FileReader crudo, SIN compresión) — esto produce payload grande. type=" + file.type + " size=" + file.size + " bytes (" + (file.size/1024/1024).toFixed(2) + " MB)");
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    const t = setTimeout(() => reject(new Error("timeout leyendo archivo (>30s)")), 30000);
    r.onload = () => { clearTimeout(t); resolve(r.result); };
    r.onerror = () => { clearTimeout(t); reject(new Error("FileReader.onerror")); };
    r.readAsDataURL(file);
  });
}

// Manda los errores de decodificación/cascada al backend para que podamos ver
// MAÑANA cuántas creadoras tropiezan y de qué tipo. Best-effort, jamás bloquea.
async function _postTelemetry(errorType, fileInfo, decoderPath) {
  const token = getToken();
  if (!token) return;
  try {
    await fetch(API_DEBUG_LOG, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        token,
        error_type: errorType,
        user_agent: navigator.userAgent || "",
        file_info: fileInfo || {},
        decoder_path: Array.isArray(decoderPath) ? decoderPath : [],
      }),
      keepalive: true,
    });
  } catch (e) {
    _logErr("telemetría falló (no crítico):", e.message);
  }
}

function _spinnerHtml(texto) {
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 8px;font-size:11px;color:rgba(255,255,255,.7);letter-spacing:.1em;text-transform:uppercase">
    <div style="width:24px;height:24px;border:2px solid rgba(232,255,76,.25);border-top-color:#e8ff4c;border-radius:50%;animation:ctr-spin 0.8s linear infinite"></div>
    <span>${texto}</span>
  </div>`;
}

// Devuelve el peso aproximado en bytes que pesará un data URL ya en JSON.
// Un data URL base64 pesa ~length chars; la decodificación a bytes es ~length*0.75
// pero lo que viaja al servidor es el string base64 dentro del JSON, así que
// para estimar el payload usamos length directamente.
function _dataUrlBytes(d) { return d ? d.length : 0; }

// HTML del badge de tamaño que va debajo del preview. Verde <2MB, amarillo
// 2-3MB, rojo >3MB. La creadora ve el resultado real ANTES de enviar. Si la
// foto cayó al fallback crudo, lo marcamos con "(sin comprimir)" — la cascada
// del envío intentará re-decodificar de todos modos antes de POSTear.
function _sizeBadgeHtml(side, dataUrl, usedFallback) {
  const bytes = _dataUrlBytes(dataUrl);
  const mb = bytes / 1024 / 1024;
  let color, icon;
  if (mb < 2) { color = "#88ea4e"; icon = "✓"; }
  else if (mb < 3) { color = "#e8ff4c"; icon = "⚠"; }
  else { color = "#ff8888"; icon = "✗"; }
  const fallbackTag = usedFallback ? ' <span style="color:rgba(255,255,255,.7)">(sin comprimir)</span>' : "";
  const sideLbl = side === "frente" ? "Frente" : "Reverso";
  return `<div data-badge="1" style="position:absolute;bottom:6px;left:6px;right:6px;background:rgba(0,0,0,.78);color:${color};padding:6px 10px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;text-align:center;pointer-events:none">${sideLbl}: ${mb.toFixed(2)} MB ${icon}${fallbackTag}</div>`;
}

// HTML para mostrar el error cuando ni canvas ni FileReader pudieron procesar
// la foto. Preserva saltos de línea del mensaje (algunos son listas con \n).
function _renderErrorState(label, side, inputId, msg) {
  label.classList.remove("has-file");
  label.innerHTML = `
    <span class="lbl-title">📸 ${side === "frente" ? "Frente" : "Reverso"} del INE</span>
    <span class="lbl-hint" style="color:#ff8888;line-height:1.5;padding:0 4px;white-space:pre-line;text-align:left">${escapeHtml(msg)}</span>
  ` + _fileInputHtml(inputId);
}

function setupFileInput(side) {
  const inputId = side === "frente" ? "fileFrente" : "fileReverso";
  const labelId = side === "frente" ? "lblFrente" : "lblReverso";
  const label = document.getElementById(labelId);
  // state guarda dataUrl (lo que se manda) + file (original) + usedFallback +
  // needsManualConversion (HEIC sin decoder). El File original se conserva
  // para que la cascada de enviarFirma re-decodifique con params agresivos.
  const state = { dataUrl: null, file: null, usedFallback: false, needsManualConversion: false, method: null };

  async function onPick(ev) {
    const inp = ev.target;
    const f = inp.files && inp.files[0];
    _log(side + ": change disparado, file?:", !!f);
    if (!f) return;
    _log(side + ": archivo recibido —", f.name, "/", f.type || "(tipo vacío)", "/", f.size, "bytes (" + (f.size/1024/1024).toFixed(2) + " MB)");
    if (f.size > 30 * 1024 * 1024) {
      alert("La foto supera 30 MB.");
      inp.value = "";
      return;
    }

    // Render loader mientras procesa.
    label.classList.add("has-file");
    label.innerHTML = _spinnerHtml("Procesando foto…") + _fileInputHtml(inputId);
    bindNewInput();

    let finalDataUrl, method, attempts;

    try {
      const r = await _decodeToJpeg(f);
      finalDataUrl = r.dataUrl;
      method = r.method;
      attempts = r.attempts;
    } catch (e) {
      const isHeic = e.isHeic === true;
      attempts = e.attempts || [];
      _logErr(side + ": decoder chain agotado | isHEIC=" + isHeic + " | attempts=" + JSON.stringify(attempts));
      state.dataUrl = null;
      state.file = f;  // conservamos el File por si el usuario reintenta
      state.usedFallback = false;
      state.needsManualConversion = isHeic;
      state.method = null;
      _postTelemetry(isHeic ? "heic_decode_failed" : "decoder_chain_failed", {
        side, file_type: f.type || "", file_size: f.size, file_name: f.name || "",
      }, attempts);
      _renderErrorState(label, side, inputId, isHeic ? MSG_FOTOS_HEIC : MSG_FOTOS_NO_BAJAN);
      bindNewInput();
      checkSubmit();
      return;
    }

    state.dataUrl = finalDataUrl;
    state.file = f;
    state.usedFallback = (method === "fallback-raw");
    state.needsManualConversion = false;
    state.method = method;
    const finalMB = (finalDataUrl.length * 0.75 / 1024 / 1024);
    _log(side + ": ✓ listo — method=" + method + " | final≈" + finalMB.toFixed(2) + " MB");

    // Preview + badge de tamaño con color (verde/amarillo/rojo) para que la
    // creadora sepa de entrada si la foto va a dar problemas.
    label.innerHTML = `
      <img class="preview-img" src="${finalDataUrl}" alt="${side}" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<div style=\\'padding:14px;font-size:11px;color:rgba(255,255,255,.6)\\'>✓ Foto cargada (sin preview disponible)</div>')">
      ${_sizeBadgeHtml(side, finalDataUrl, state.usedFallback)}
    ` + _fileInputHtml(inputId);
    bindNewInput();
    checkSubmit();
  }

  // Actualiza solo el badge cuando recomprimimos desde enviarFirma. No re-renderiza
  // todo el preview porque la imagen ya está mostrada y solo cambió el tamaño.
  function refreshBadge() {
    if (!state.dataUrl) return;
    const old = label.querySelector("div[data-badge]");
    if (old) old.remove();
    label.insertAdjacentHTML("beforeend", _sizeBadgeHtml(side, state.dataUrl, state.usedFallback));
  }
  state.refreshBadge = refreshBadge;

  function bindNewInput() {
    const inp = document.getElementById(inputId);
    if (inp) {
      // Si el input ya tiene listener, remove first para evitar duplicar.
      inp.removeEventListener("change", onPick);
      inp.addEventListener("change", onPick);
    }
  }

  // Bind inicial.
  bindNewInput();
  return state;
}

function _fileInputHtml(id) {
  return `<input type="file" id="${id}" accept="image/*" capture="environment">`;
}

let firma, ineFrenteState, ineReversoState;

// Captura al firmar (plantilla creadora): fecha de nacimiento + contacto de
// emergencia OBLIGATORIOS. Los flujos sin estos inputs (coordinador/giveaway,
// que no los pintan) devuelven true y quedan EXACTO como antes.
function _datosFirmaOk() {
  const f = document.getElementById("fnacInput");
  if (!f) return true;
  const n = document.getElementById("emNomInput");
  const t = document.getElementById("emTelInput");
  return !!(f.value && n && n.value.trim() && t && t.value.trim());
}

// Payload de la captura para contrato-firmar. null si el flujo no la pinta.
function _datosFirmaPayload() {
  const f = document.getElementById("fnacInput");
  if (!f) return null;
  const n = document.getElementById("emNomInput");
  const t = document.getElementById("emTelInput");
  return {
    fecha_nacimiento: f.value || "",
    emergencia: {
      nombre: ((n && n.value) || "").trim(),
      telefono: ((t && t.value) || "").trim(),
    },
  };
}

function checkSubmit() {
  const accept = document.getElementById("acepto");
  const btn = document.getElementById("btnFirmar");
  if (!btn) return;
  btn.disabled = !(firma && firma.hasInk() && ineFrenteState.dataUrl && ineReversoState.dataUrl && accept.checked && _datosFirmaOk());
}

// Mensaje accionable que mostramos cuando ni la cascada de compresión logra
// bajar el payload del límite (raro). Le decimos a la creadora exactamente
// qué hacer con su teléfono — no le pedimos "achícalas" sin explicar cómo.
const MSG_FOTOS_NO_BAJAN =
  "Tus fotos tienen tanto detalle que no podemos enviarlas a nuestros servidores. " +
  "Si usas iPhone: abre Ajustes → Cámara → Formatos y elige \"Más compatible\". " +
  "Si usas Android: baja la resolución de la cámara antes de tomar la foto del INE. " +
  "Después, toma de nuevo las fotos del frente y reverso.";

// Mensaje específico para HEIC sin decoder disponible (iPhone con iOS <15 o
// alguna combinación rara de Safari). Damos 2 caminos: convertir la foto
// antes de subir, o cambiar el formato de cámara del iPhone.
const MSG_FOTOS_HEIC =
  "Tu foto está en formato HEIC (típico de iPhone). Hay 2 formas de arreglarlo:\n\n" +
  "OPCIÓN A — Convertir antes de subir:\n" +
  "1. Abre la foto en la app Fotos del iPhone\n" +
  "2. Toca el ícono de compartir (cuadrado con flecha)\n" +
  "3. Elige \"Copiar foto\" → cierra\n" +
  "4. Regresa aquí y pega la foto\n\n" +
  "OPCIÓN B — Cambiar formato del iPhone:\n" +
  "1. Ajustes → Cámara → Formatos → \"Más compatible\"\n" +
  "2. Toma de nuevo la foto del INE\n\n" +
  "Lo sentimos por el inconveniente — estamos trabajando en arreglar esto pronto.";

// Cascada de re-compresión cuando el payload total queda muy pesado. Re-corre
// _decodeToJpeg con params más agresivos sobre el File original. Incluye fotos
// que vinieron por fallback-raw — el decoder primario (createImageBitmap) puede
// haber fallado por params, no por incapacidad fundamental.
const COMPRESS_STEPS = [
  { maxDim: 1400, quality: 0.72 },
  { maxDim: 1200, quality: 0.65 },
  { maxDim: 1000, quality: 0.60 },
];

async function enviarFirma(token, btn, errBox) {
  if (btn.disabled) return;
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = "Enviando…";
  errBox.classList.remove("show");
  _log("enviarFirma: inicio, token=" + token.slice(0,8) + "…");
  try {
    const firmaData = firma && firma.dataURL ? firma.dataURL() : "";
    _log("firma_data:", firmaData ? (firmaData.length + " chars, prefix " + firmaData.slice(0,30)) : "VACÍA");
    _log("ine_frente:", ineFrenteState.dataUrl ? (ineFrenteState.dataUrl.length + " chars, prefix " + ineFrenteState.dataUrl.slice(0,30)) : "VACÍA");
    _log("ine_reverso:", ineReversoState.dataUrl ? (ineReversoState.dataUrl.length + " chars, prefix " + ineReversoState.dataUrl.slice(0,30)) : "VACÍA");

    if (!firmaData.startsWith("data:image/")) throw new Error("La firma se borró. Vuelve a firmar antes de enviar.");
    if (!ineFrenteState.dataUrl) throw new Error("Falta foto del frente del INE.");
    if (!ineReversoState.dataUrl) throw new Error("Falta foto del reverso del INE.");

    // Gate: si alguna foto quedó marcada como HEIC sin decoder, no tiene sentido
    // intentar la cascada porque _decodeToJpeg va a fallar otra vez. Mostramos
    // el mensaje accionable y paramos.
    const allStates = [ineFrenteState, ineReversoState];
    if (allStates.some(s => s.needsManualConversion)) {
      throw new Error(MSG_FOTOS_HEIC);
    }

    const buildPayload = () => {
      const p = {
        token,
        firma_data: firmaData,
        ine_frente: ineFrenteState.dataUrl,
        ine_reverso: ineReversoState.dataUrl,
      };
      // Captura de la creadora (fnac + emergencia). null en flujos sin captura.
      const df = _datosFirmaPayload();
      if (df) p.datos_firma = df;
      return p;
    };
    const sizeMB = (p) => JSON.stringify(p).length / 1024 / 1024;

    let payload = buildPayload();
    let curMB = sizeMB(payload);
    _log("payload inicial: " + curMB.toFixed(2) + " MB " +
      "| frente=" + (ineFrenteState.dataUrl.length/1024/1024*0.75).toFixed(2) + " MB" +
      " method=" + (ineFrenteState.method || "?") +
      " | reverso=" + (ineReversoState.dataUrl.length/1024/1024*0.75).toFixed(2) + " MB" +
      " method=" + (ineReversoState.method || "?"));

    // Compresión adaptativa: si excede 4 MB intentamos recomprimir en cascada.
    // Re-corremos _decodeToJpeg con params más agresivos sobre TODAS las fotos
    // (incluyendo fallback-raw — el decoder primario puede haber fallado por
    // params, ahora con maxDim menor podría funcionar y bajar el peso).
    if (curMB > 4) {
      const compresibles = allStates.filter(s => s.file);
      if (!compresibles.length) {
        _logErr("payload " + curMB.toFixed(2) + " MB pero ninguna foto tiene File para recomprimir");
        throw new Error(MSG_FOTOS_NO_BAJAN);
      }
      btn.textContent = "Optimizando fotos…";
      for (let i = 0; i < COMPRESS_STEPS.length; i++) {
        const step = COMPRESS_STEPS[i];
        _log("recompresión paso " + (i+1) + "/" + COMPRESS_STEPS.length +
          " (maxDim=" + step.maxDim + ", q=" + step.quality + ")");
        for (const s of compresibles) {
          try {
            const r = await _decodeToJpeg(s.file, step.maxDim, step.quality);
            s.dataUrl = r.dataUrl;
            s.usedFallback = (r.method === "fallback-raw");
            s.method = r.method;
            if (s.refreshBadge) s.refreshBadge();
          } catch (e) {
            _logErr("recompresión falló en paso " + (i+1) + ":", e.message);
            // No abortamos — seguimos con la dataUrl actual y el siguiente paso.
          }
        }
        payload = buildPayload();
        curMB = sizeMB(payload);
        _log("payload tras paso " + (i+1) + ": " + curMB.toFixed(2) + " MB");
        if (curMB <= 5) break;  // suficiente margen, salir de la cascada
      }
      btn.textContent = "Enviando…";
    }

    if (curMB > 5.5) {
      _logErr("payload final " + curMB.toFixed(2) + " MB tras agotar cascada — no podemos enviar");
      _postTelemetry("cascade_exhausted", {
        final_payload_mb: Number(curMB.toFixed(2)),
        sides: allStates.map((s, idx) => ({
          side: idx === 0 ? "frente" : "reverso",
          file_type: (s.file && s.file.type) || "",
          file_size: (s.file && s.file.size) || 0,
          data_url_mb: Number(((s.dataUrl ? s.dataUrl.length : 0) * 0.75 / 1024 / 1024).toFixed(2)),
          method: s.method || "?",
          usedFallback: !!s.usedFallback,
        })),
      }, []);
      throw new Error(MSG_FOTOS_NO_BAJAN);
    }

    _log("payload final: " + curMB.toFixed(2) + " MB ✓");
    _log("POST /.netlify/functions/contrato-firmar…");
    const resp = await fetch(API_FIRMAR, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    _log("respuesta HTTP:", resp.status, resp.statusText);
    let j;
    try { j = await resp.json(); }
    catch (e2) { throw new Error("Respuesta del servidor no es JSON (status " + resp.status + ")"); }
    _log("respuesta body:", JSON.stringify(j).slice(0,200));
    if (!resp.ok || !j.ok) {
      throw new Error(j.error || ("Error " + resp.status));
    }
    _log("✓ firma exitosa, recargando vista");
    loadContrato();
  } catch (e) {
    _logErr("enviarFirma falló:", e.message, "|", e.stack ? e.stack.split('\n')[0] : "");
    errBox.textContent = e.message || "No pudimos guardar tu firma. Intenta de nuevo.";
    errBox.classList.add("show");
    btn.disabled = false;
    btn.textContent = original;
  }
}

async function loadContrato() {
  const root = document.getElementById("root");
  const token = getToken();
  if (!token) {
    root.innerHTML = `
      <div class="state-screen">
        <span class="badge-tag">⚠ Link inválido</span>
        <h1>Falta el token</h1>
        <p>Este link no incluye un token. Pídele a Conecta Reynosa que te reenvíe tu invitación.</p>
        <a class="btn-link" href="https://conectareynosa.mx">Ir al sitio</a>
      </div>`;
    return;
  }
  root.innerHTML = `<div class="loading">Cargando contrato…</div>`;
  let data;
  try {
    const r = await fetch(`${API_OBTENER}?t=${encodeURIComponent(token)}`);
    data = await r.json();
    if (!r.ok || !data.ok) {
      const msg = data && data.error ? data.error : "Contrato no encontrado";
      root.innerHTML = `
        <div class="state-screen">
          <span class="badge-tag">❌ ${escapeHtml(msg)}</span>
          <h1>No encontramos tu contrato</h1>
          <p>El token expiró o no es válido. Contáctanos por WhatsApp si crees que es un error.</p>
          <a class="btn-link" href="https://wa.me/528119771072">WhatsApp 81 1977 1072</a>
        </div>`;
      return;
    }
  } catch (e) {
    root.innerHTML = `
      <div class="state-screen">
        <span class="badge-tag">⚠ Error de red</span>
        <h1>Inténtalo de nuevo</h1>
        <p>${escapeHtml(e.message)}</p>
        <a class="btn-link" href="javascript:location.reload()">Reintentar</a>
      </div>`;
    return;
  }

  const c = data.contrato;
  root.innerHTML = renderDoc(c, { estado: c.estado });

  // Inyectar listas y nombre en cláusula 1.
  const creadorEl = root.querySelector(".creador-strong");
  if (creadorEl) creadorEl.textContent = c.creador_nombre;
  renderItemList(root.querySelector(".item-list-ofrecimiento"), c.ofrecimiento);
  renderItemList(root.querySelector(".item-list-expectativas"), c.expectativas);

  if (c.estado === "pendiente") {
    firma = setupFirmaCanvas();
    ineFrenteState = setupFileInput("frente");
    ineReversoState = setupFileInput("reverso");
    document.getElementById("btnLimpiarFirma").addEventListener("click", () => {
      firma.clear(); firma.setHasInk(false); checkSubmit();
    });
    document.getElementById("firmaCanvas").addEventListener("mouseup", checkSubmit);
    document.getElementById("firmaCanvas").addEventListener("touchend", checkSubmit);
    document.getElementById("acepto").addEventListener("change", checkSubmit);
    // Captura al firmar (solo existe en el flujo de creadora).
    ["fnacInput", "emNomInput", "emTelInput"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) { el.addEventListener("input", checkSubmit); el.addEventListener("change", checkSubmit); }
    });
    document.getElementById("btnFirmar").addEventListener("click", () => {
      const errBox = document.getElementById("formErr");
      enviarFirma(getToken(), document.getElementById("btnFirmar"), errBox);
    });
  }
}

loadContrato();
</script>
