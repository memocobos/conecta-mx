# Redirects
[[redirects]]
  from = "/admin"
  to = "/kamehouse"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://www.googletagmanager.com https://connect.facebook.net https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.anthropic.com https://api.airtable.com https://*.supabase.co wss://*.supabase.co https://lcffgrrwbbbgorooawyd.supabase.co https://muvvrstnkxsxfpkhbntq.supabase.co https://www.google-analytics.com https://*.analytics.google.com https://www.facebook.com https://connect.facebook.net https://raw.githubusercontent.com https://www.theaudiodb.com; img-src 'self' data: https:; media-src 'self' https://*.dzcdn.net; frame-src 'self' https://*.supabase.co; frame-ancestors 'self';"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Forzar revalidación del HTML del rol — evita que el navegador sirva versiones
# viejas mientras seguimos iterando en el cálculo del plan de pagos.
[[headers]]
  for = "/rol"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/rol.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
[functions]
  directory = "netlify/functions"

[functions."check-strikes-diario"]
  schedule = "0 0 * * *"

# Marca pagos pendientes vencidos en la BD del portal (excluye tours cancelados).
# 08:00 UTC = 2:00 AM hora México, antes del día laboral.
[functions."marcar-vencidos-diario"]
  schedule = "0 8 * * *"

# Recordatorios de pago de /rol — 14:00 UTC = 8:00 AM CDMX
[functions."rol-recordatorios"]
  schedule = "0 14 * * *"

# Notificaciones de lista de espera — detecta transición 'proximamente' → activo
# y manda emails a los registrados. 14:00 UTC = 8:00 AM CDMX, mismo slot diario.
[functions."waitlist-notify"]
  schedule = "0 14 * * *"

# Radar del Dragón — detector de anomalías. Corre 2x día:
#   14:00 UTC = 8:00 AM hora México
#   02:00 UTC = 8:00 PM hora México (del día anterior)
[functions."radar-alertas"]
  schedule = "0 14,2 * * *"

# Auto-sync de eventos_meta desde el EV de index.html (U1). Parsea EV server-side
# y hace upsert por slug (nunca borra). Corre ANTES de recordatorio-eventos-diario
# para que éste lea una proyección fresca. 13:00 UTC = 7:00 AM hora México (2 h antes).
[functions."eventos-meta-sync-cron"]
  schedule = "0 13 * * *"

# Recordatorio "tu evento es pronto" para coordis (U3 / DC2c-B). Lee eventos_meta
# por slug y avisa (campanita + correo) a quien aceptó eventos en los próximos
# DIAS_ANTES días. 15:00 UTC = 9:00 AM hora México.
[functions."recordatorio-eventos-diario"]
  schedule = "0 15 * * *"
