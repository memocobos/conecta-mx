# Redirects
[[redirects]]
  from = "/admin"
  to = "/kamehouse"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://www.googletagmanager.com https://connect.facebook.net https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.anthropic.com https://*.supabase.co wss://*.supabase.co https://npgnhsmwpcipxgvfxrho.supabase.co https://muvvrstnkxsxfpkhbntq.supabase.co https://www.google-analytics.com https://*.analytics.google.com https://www.facebook.com https://connect.facebook.net https://raw.githubusercontent.com https://www.theaudiodb.com https://radio.conectareynosa.mx; img-src 'self' data: https: https://radio.conectareynosa.mx; media-src 'self' https://*.dzcdn.net https://radio.conectareynosa.mx; frame-src 'self' https://*.supabase.co; frame-ancestors 'self';"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Forzar revalidación del HTML del rol — evita que el navegador sirva versiones
# viejas mientras seguimos iterando en el cálculo del plan de pagos.
[[headers]]
  for = "/rol"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/rol.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
[functions]
  directory = "netlify/functions"

[functions."check-strikes-diario"]
  schedule = "0 0 * * *"

# Marca pagos pendientes vencidos en la BD del portal (excluye tours cancelados).
# 08:00 UTC = 2:00 AM hora México, antes del día laboral.
[functions."marcar-vencidos-diario"]
  schedule = "0 8 * * *"

# Recordatorio AMABLE de abono del PORTAL — días 9 y 24 (apertura de cada ventana
# de pago) avisa a clientes AL CORRIENTE el monto de su abono de la quincena. Solo
# notifica. 14:00 UTC = 8:00 AM hora México.
[functions."portal-recordatorios-diario"]
  schedule = "0 14 9,24 * *"

# Morosidad escalada del PORTAL — días 17 y 2 manda correo por nivel (1=aviso,
# 2=congelado, 3=última advertencia) a clientes con quincenas vencidas. Solo
# notifica (no da de baja). 14:00 UTC = 8:00 AM hora México, DESPUÉS de
# marcar-vencidos-diario (08:00 UTC), para leer los vencidos ya marcados del corte.
[functions."portal-morosidad-diario"]
  schedule = "0 14 17,2 * *"

# Recordatorios de pago de /rol — 14:00 UTC = 8:00 AM CDMX
[functions."rol-recordatorios"]
  schedule = "0 14 * * *"

# Notificaciones de lista de espera — detecta transición 'proximamente' → activo
# y manda emails a los registrados. 14:00 UTC = 8:00 AM CDMX, mismo slot diario.
[functions."waitlist-notify"]
  schedule = "0 14 * * *"

# Radar del Dragón — detector de anomalías. Corre 2x día:
#   14:00 UTC = 8:00 AM hora México
#   02:00 UTC = 8:00 PM hora México (del día anterior)
[functions."radar-alertas"]
  schedule = "0 14,2 * * *"

# Auto-sync de eventos_meta desde el EV de index.html (U1). Parsea EV server-side
# y hace upsert por slug (nunca borra). Corre ANTES de recordatorio-eventos-diario
# para que éste lea una proyección fresca. 13:00 UTC = 7:00 AM hora México (2 h antes).
[functions."eventos-meta-sync-cron"]
  schedule = "0 13 * * *"

# Recordatorio "tu evento es pronto" para coordis (U3 / DC2c-B). Lee eventos_meta
# por slug y avisa (campanita + correo) a quien aceptó eventos en los próximos
# DIAS_ANTES días. 15:00 UTC = 9:00 AM hora México.
[functions."recordatorio-eventos-diario"]
  schedule = "0 15 * * *"

# "Tu abono vence HOY" del PORTAL — DIARIO. Avisa a clientes con un pago pendiente
# cuya fecha_esperada = hoy (hora MX). Cierra la escalera de cobranza (apertura 9/24
# → vence hoy → morosidad 17/2). Solo notifica; NO cambia estados. Salta cancelados
# y a quien ya tiene pagos vencidos (los cubre morosidad). 14:00 UTC = 8:00 AM MX.
[functions."vence-hoy-diario"]
  schedule = "0 14 * * *"

# Contratos F4 — alertas pre-viaje de contratos SIN FIRMAR. DIARIO. A 7 días de la
# PRIMERA fecha del evento (catalogo-index.ds) y diario los últimos 3 (días 3/2/1)
# manda: (1) UN resumen al admin con pendientes + lugares sin contrato por evento y
# (2) recordatorio de firma al cliente (dueño del lugar si conectado, si no al
# titular). "Sin firma no hay servicio" necesita tiempo de reacción. Solo notifica;
# no toca el motor ni los estados. 14:00 UTC = 8:00 AM MX, slot de cobranza.
[functions."contratos-alerta-cron"]
  schedule = "0 14 * * *"

# Vigilante de Radio Conecta — checa el nowplaying CADA 10 MINUTOS (timeout 8s +
# 1 reintento a los 15s). Si 2 corridas seguidas fallan (~20 min de caída) manda
# UN correo de alerta a Memo (máx 1 cada 6 h mientras siga caída) y otro al
# recuperarse (con duración). Estado en Portal `radio_vigilante` (1 fila).
[functions."radio-vigilante"]
  schedule = "*/10 * * * *"

# Vendedores F4 — expiración del límite de 8 días de las VENTAS de vendedor. DIARIO.
# Barre solicitudes_tour con vendedor_id aún PENDIENTES cuyo vende_limite venció (o
# vence hoy/mañana) y manda UN resumen al admin para que Bulma reaccione. SOLO
# NOTIFICA — jamás cancela (la cancelación es manual en KameHouse). 14:00 UTC = 8 AM MX.
[functions."ventas-limite-cron"]
  schedule = "0 14 * * *"
