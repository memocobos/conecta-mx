[[headers]]
  for = "/*"
  [headers.values]
    # Evita que el sitio se cargue en iframes de otros dominios
    X-Frame-Options = "SAMEORIGIN"
    # Evita que el browser adivine el tipo de contenido
    X-Content-Type-Options = "nosniff"
    # Activa protección XSS en browsers antiguos
    X-XSS-Protection = "1; mode=block"
    # No envía el referrer a sitios externos
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Fuerza HTTPS por 1 año
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Limita qué recursos puede cargar la página
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.anthropic.com https://api.airtable.com; img-src 'self' data: https:; frame-ancestors 'self';"
    # Desactiva funciones del browser que no necesitas
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    # Las functions solo aceptan POST desde tu dominio
    Access-Control-Allow-Origin = "https://conectareynosa.mx"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
