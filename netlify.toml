# Redirects
[[redirects]]
  from = "/admin"
  to = "/kamehouse"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.anthropic.com https://api.airtable.com https://*.supabase.co wss://*.supabase.co https://lcffgrrwbbbgorooawyd.supabase.co https://www.google-analytics.com https://*.analytics.google.com https://www.facebook.com https://connect.facebook.net https://raw.githubusercontent.com; img-src 'self' data: https:; media-src 'self' https://*.dzcdn.net; frame-src 'self' https://*.supabase.co; frame-ancestors 'self';"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
